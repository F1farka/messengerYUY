<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вход — Мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #4f6ef7;
    --accent2: #7c3aed;
    --text: #f0f0f8;
    --muted: #6b6b80;
    --success: #10b981;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }

  /* Animated background */
  .bg-orbs {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.15;
    animation: drift 8s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: 3s; }
  .orb3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; left: 60%; animation-delay: 5s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -20px) scale(1.05); }
  }

  /* WELCOME SCREEN */
  #welcome {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #welcome.hide {
    opacity: 0; transform: scale(1.05);
    pointer-events: none;
  }

  .welcome-emoji {
    font-size: 72px; margin-bottom: 24px;
    animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0; transform: scale(0.3);
  }
  @keyframes bounceIn {
    to { opacity: 1; transform: scale(1); }
  }

  .welcome-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 8vw, 56px); font-weight: 800;
    color: var(--text); letter-spacing: -1px;
    overflow: hidden; height: 1.2em;
  }
  .welcome-title span {
    display: inline-block;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    opacity: 0; transform: translateY(100%);
  }
  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .welcome-sub {
    font-size: 17px; color: var(--muted); margin-top: 12px;
    animation: fadeIn 0.5s ease 0.9s forwards; opacity: 0;
  }
  .welcome-dots {
    margin-top: 48px; display: flex; gap: 8px;
    animation: fadeIn 0.5s ease 1.1s forwards; opacity: 0;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
  .dot:nth-child(3) { animation-delay: 0.4s; background: #06b6d4; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 1; }
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* FORM CARD */
  .card-wrap {
    position: relative; z-index: 1;
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    width: 100%; max-width: 400px; padding: 20px;
  }
  .card-wrap.show { opacity: 1; transform: translateY(0); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79,110,247,0.5), transparent);
  }

  .logo { text-align: center; font-size: 48px; margin-bottom: 8px; }
  h2 {
    text-align: center; color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 700; margin-bottom: 6px;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .input-group { position: relative; margin-bottom: 14px; }
  .input-group label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 13px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif;
    outline: none; transition: border 0.2s, background 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    background: rgba(79,110,247,0.06);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
  }
  input::placeholder { color: #3a3a50; }

  button[type="submit"] {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: #fff; font-size: 16px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 20px rgba(79,110,247,0.3);
  }
  button[type="submit"]::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0; transition: opacity 0.2s;
  }
  button[type="submit"]:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(79,110,247,0.4); }
  button[type="submit"]:hover::after { opacity: 1; }
  button[type="submit"]:active { transform: translateY(0); }

  .links { text-align: center; margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .links a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
  .links a:hover { color: #7c9fff; }
  .links .sep { color: var(--muted); font-size: 13px; }

  .stagger-1 { animation-delay: 0.1s !important; }
  .stagger-2 { animation-delay: 0.15s !important; }
  .stagger-3 { animation-delay: 0.2s !important; }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- WELCOME SCREEN -->
<div id="welcome">
  <div class="welcome-emoji">💬</div>
  <div class="welcome-title"><span>Добро пожаловать</span></div>
  <p class="welcome-sub">Ваш личный мессенджер</p>
  <div class="welcome-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<!-- FORM -->
<div class="card-wrap" id="cardWrap">
  <div class="card">
    <div class="logo">💬</div>
    <h2>С возвращением</h2>
    <p class="subtitle">Введите данные для входа</p>
    <form method="POST">
      <div class="input-group">
        <label>Логин</label>
        <input type="text" name="username" placeholder="Ваш логин" required autofocus>
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="Ваш пароль" required>
      </div>
      <button type="submit">Войти</button>
    </form>
    <div class="links">
      <span class="sep">Нет аккаунта? <a href="/register">Создать</a></span>
      <a href="/forgot">Забыли пароль?</a>
    </div>
  </div>
</div>

<script>
  // Show welcome for 2.2s, then fade out and show form
  setTimeout(() => {
    document.getElementById('welcome').classList.add('hide');
    setTimeout(() => {
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('cardWrap').classList.add('show');
    }, 800);
  }, 2200);
</script>
</body>
</html>
