<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сброс пароля — Мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #08050a; --surface: rgba(28, 20, 30, 0.8); --border: rgba(255, 255, 255, 0.08);
    --accent: #f43f5e; --accent2: #8b5cf6; --text: #ffffff; --muted: #a08ea0;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; color: var(--text); }
  .bg-blobs { position: fixed; inset: 0; z-index: -1; filter: blur(100px); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.3; animation: move 20s infinite alternate; }
  .b1 { width: 450px; height: 450px; background: var(--accent); top: -10%; left: -10%; }
  .b2 { width: 400px; height: 400px; background: var(--accent2); bottom: -10%; right: -5%; }
  @keyframes move { from { transform: scale(1); } to { transform: scale(1.1) translate(50px, 30px); } }
  .card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 40px; border-radius: 32px; animation: slideUp 0.8s forwards; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  h2 { font-family: 'Syne', sans-serif; font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 30px; font-size: 14px; }
  .step { display: none; } .step.active { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
  .input-group { text-align: left; margin-bottom: 20px; }
  .input-group label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
  .input-group input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 16px; border-radius: 16px; color: #fff; font-size: 16px; outline: none; }
  button { width: 100%; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; }
  .links { margin-top: 25px; font-size: 14px; } .links a { color: var(--accent2); text-decoration: none; font-weight: 600; }
  .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <h2>Сброс пароля</h2>
  <p class="subtitle" id="main-sub">Шаг 1: Подтвердите личность</p>

  <!-- Шаг 1: Логин -->
  <div id="step1" class="step active">
    <div class="input-group"><label>Ваш логин</label><input type="text" id="username" placeholder="ivan_pro"></div>
    <button onclick="checkUser()">Продолжить</button>
  </div>

  <!-- Шаг 2: Секретное слово -->
  <div id="step2" class="step">
    <div class="input-group"><label>Секретное слово</label><input type="text" id="secret" placeholder="Ваше слово"></div>
    <button onclick="checkSecret()">Проверить</button>
  </div>

  <!-- Шаг 3: Новый пароль -->
  <div id="step3" class="step">
    <div class="input-group"><label>Новый пароль</label><input type="password" id="newpass" placeholder="••••••••"></div>
    <button onclick="resetPass()">Обновить пароль</button>
  </div>

  <div id="error" class="error-msg"></div>
  <div class="links"><a href="/login">← Вернуться к входу</a></div>
</div>

<script>
let user = "";
const err = document.getElementById('error');
const sub = document.getElementById('main-sub');

function showError(text) { err.innerText = text; err.style.display = 'block'; }
function hideError() { err.style.display = 'none'; }

async function checkUser() {
    user = document.getElementById('username').value;
    const res = await fetch('/forgot/check-user', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user})
    });
    const d = await res.json();
    if(d.ok) {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        sub.innerText = "Шаг 2: Введите секретное слово";
        hideError();
    } else showError(d.error);
}

async function checkSecret() {
    const s = document.getElementById('secret').value;
    const res = await fetch('/forgot/check-secret', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user, secret_word: s})
    });
    const d = await res.json();
    if(d.ok) {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        sub.innerText = "Шаг 3: Придумайте новый пароль";
        hideError();
    } else showError(d.error);
}

async function resetPass() {
    const p = document.getElementById('newpass').value;
    const res = await fetch('/forgot/reset', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user, new_password: p})
    });
    const d = await res.json();
    if(d.ok) window.location.href = '/login';
    else showError(d.error);
}
</script>
</body>
</html>
