<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление — SYNAPSE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
  body { background: #050505; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  .bg-orbs { position: absolute; inset: 0; z-index: 0; filter: blur(120px); pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; opacity: 0.3; }
  .orb-1 { width: 50vw; height: 50vw; background: #FF0076; top: -20%; left: -10%; }
  .orb-2 { width: 40vw; height: 40vw; background: #590FB7; bottom: -20%; right: -10%; }

  .glass-card { position: relative; z-index: 1; background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); width: 100%; max-width: 420px; padding: 48px; border-radius: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
  .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #FF0076, #590FB7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; text-align: center; }
  .subtitle { text-align: center; color: #888; font-size: 15px; margin-bottom: 32px; }

  .step { display: none; animation: fadeIn 0.4s; }
  .step.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

  .input-group { margin-bottom: 16px; }
  .input-group input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 16px 20px; border-radius: 16px; color: #fff; font-size: 15px; outline: none; }
  .input-group input:focus { border-color: #FF0076; }

  .btn-submit { width: 100%; padding: 16px; margin-top: 10px; border-radius: 16px; border: none; background: linear-gradient(135deg, #FF0076, #590FB7); color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.3s; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(89, 15, 183, 0.4); }

  .links { display: flex; justify-content: center; margin-top: 24px; font-size: 14px; }
  .links a { color: #aaa; text-decoration: none; transition: 0.2s; }
  .links a:hover { color: #FF0076; }
  .error-msg { background: rgba(255,50,50,0.1); color: #ff5555; padding: 12px; border-radius: 12px; margin-top: 16px; text-align: center; font-size: 14px; display: none; }
</style>
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div class="glass-card">
    <div class="logo">СБРОС ПАРОЛЯ</div>
    <div class="subtitle" id="main-sub">Шаг 1: Идентификация</div>

    <div id="step1" class="step active">
      <div class="input-group"><input type="text" id="username" placeholder="Ваш логин"></div>
      <button class="btn-submit" onclick="checkUser()">Далее</button>
    </div>

    <div id="step2" class="step">
      <div class="input-group"><input type="text" id="secret" placeholder="Секретное слово"></div>
      <button class="btn-submit" onclick="checkSecret()">Проверить</button>
    </div>

    <div id="step3" class="step">
      <div class="input-group"><input type="password" id="newpass" placeholder="Новый пароль"></div>
      <button class="btn-submit" onclick="resetPass()">Обновить</button>
    </div>

    <div id="error" class="error-msg"></div>
    <div class="links"><a href="/login">← Вернуться ко входу</a></div>
  </div>

<script>
let user = "";
const err = document.getElementById('error');
const sub = document.getElementById('main-sub');

function showError(text) { err.innerText = text; err.style.display = 'block'; }
function hideError() { err.style.display = 'none'; }

async function checkUser() {
    user = document.getElementById('username').value.trim();
    if(!user) return;
    const res = await fetch('/forgot/check-user', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: user}) });
    const d = await res.json();
    if(d.ok) { document.getElementById('step1').classList.remove('active'); document.getElementById('step2').classList.add('active'); sub.innerText = "Шаг 2: Секретное слово"; hideError(); }
    else showError(d.error);
}

async function checkSecret() {
    const s = document.getElementById('secret').value;
    const res = await fetch('/forgot/check-secret', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: user, secret_word: s}) });
    const d = await res.json();
    if(d.ok) { document.getElementById('step2').classList.remove('active'); document.getElementById('step3').classList.add('active'); sub.innerText = "Шаг 3: Новый пароль"; hideError(); }
    else showError(d.error);
}

async function resetPass() {
    const p = document.getElementById('newpass').value;
    const res = await fetch('/forgot/reset', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: user, new_password: p}) });
    const d = await res.json();
    if(d.ok) window.location.href = '/login'; else showError(d.error);
}
</script>
</body>
</html>
