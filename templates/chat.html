<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Чат с {{ partner }}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
    --border: #1e1e2e; --accent: #4f6ef7; --accent2: #7c3aed;
    --green: #10b981; --text: #f0f0f8; --muted: #6b6b80; --sub: #3a3a50;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 300px; background: var(--surface);
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800; color: var(--text);
  }
  .logout {
    color: var(--muted); font-size: 13px; text-decoration: none;
    padding: 6px 10px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border); transition: all 0.2s;
  }
  .logout:hover { background: #2a2a3a; color: var(--text); }

  .chat-list { flex: 1; overflow-y: auto; }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer;
    text-decoration: none; color: inherit;
    border-bottom: 1px solid rgba(30,30,46,0.5);
    transition: background 0.15s;
    animation: itemIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .chat-item:hover { background: var(--surface2); }
  .chat-item.active { background: var(--surface2); border-left: 2px solid var(--accent); }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    transition: transform 0.2s;
  }
  .chat-item:hover .avatar { transform: scale(1.08); }
  .avatar.global { background: linear-gradient(135deg, var(--green), #059669); }

  .chat-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .chat-preview { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* CHAT AREA */
  .chat-area {
    flex: 1; display: flex; flex-direction: column;
    background: var(--bg); min-width: 0;
  }

  .chat-header {
    padding: 14px 20px;
    background: rgba(19,19,26,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    z-index: 10; flex-shrink: 0;
  }
  .back-btn {
    display: none; color: var(--accent); font-size: 22px;
    text-decoration: none; margin-right: 4px; padding: 4px;
    transition: transform 0.2s;
  }
  .back-btn:hover { transform: translateX(-3px); }
  .hav {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .hav.global { background: linear-gradient(135deg, var(--green), #059669); }
  .header-info h3 { font-size: 15px; font-weight: 600; color: var(--text); font-family: 'Syne', sans-serif; }
  .header-info p { font-size: 12px; color: var(--green); margin-top: 1px; }

  /* MESSAGES */
  #messages {
    flex: 1; overflow-y: auto; padding: 20px 20px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg-group {
    display: flex; flex-direction: column;
    max-width: 72%; margin: 2px 0;
    animation: msgAppear 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes msgAppear {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg-group.mine { align-self: flex-end; align-items: flex-end; }
  .msg-group.other { align-self: flex-start; align-items: flex-start; }

  .sender-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-left: 4px; font-weight: 500; }

  .bubble {
    padding: 10px 16px; border-radius: 18px;
    font-size: 15px; line-height: 1.5;
    word-wrap: break-word; word-break: break-word; color: var(--text);
    position: relative; transition: transform 0.15s;
  }
  .bubble:active { transform: scale(0.98); }

  .mine .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 12px rgba(79,110,247,0.25);
  }
  .other .bubble {
    background: var(--surface2);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .time { font-size: 11px; color: var(--sub); margin-top: 3px; padding: 0 4px; }

  /* DATE SEPARATOR */
  .date-sep {
    text-align: center; font-size: 12px; color: var(--sub);
    margin: 12px 0; display: flex; align-items: center; gap: 12px;
  }
  .date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* INPUT */
  .input-area {
    padding: 14px 20px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1; padding: 11px 18px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 22px;
    color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif;
    outline: none; resize: none; max-height: 120px; overflow-y: auto; line-height: 1.4;
    transition: border 0.2s, box-shadow 0.2s;
  }
  #msg-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
  }
  #msg-input::placeholder { color: var(--sub); }

  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: white; font-size: 17px;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 3px 12px rgba(79,110,247,0.3);
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 5px 18px rgba(79,110,247,0.4); }
  .send-btn:active { transform: scale(0.95); }

  /* MOBILE */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-area { width: 100%; }
    .back-btn { display: flex; align-items: center; justify-content: center; }
    .msg-group { max-width: 85%; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>💬 Чаты</h2>
    <a href="/logout" class="logout">Выйти</a>
  </div>
  <div class="chat-list">
    <a href="/global" class="chat-item {% if partner_id == None %}active{% endif %}">
      <div class="avatar global">🌍</div>
      <div>
        <div class="chat-name">Общий чат</div>
        <div class="chat-preview">Все пользователи</div>
      </div>
    </a>
    {% for user in all_users %}
    <a href="/chat/{{ user[0] }}" class="chat-item {% if user[0] == partner_id %}active{% endif %}">
      <div class="avatar">{{ user[1][0]|upper }}</div>
      <div>
        <div class="chat-name">{{ user[1] }}</div>
        <div class="chat-preview">Личный чат</div>
      </div>
    </a>
    {% endfor %}
  </div>
</div>

<div class="chat-area">
  <div class="chat-header">
    <a href="/" class="back-btn">❮</a>
    <div class="hav {% if partner_id == None %}global{% endif %}">
      {% if partner_id == None %}🌍{% else %}{{ partner[0]|upper }}{% endif %}
    </div>
    <div class="header-info">
      <h3>{{ partner }}</h3>
      <p>{% if partner_id == None %}Общий чат{% else %}● В сети{% endif %}</p>
    </div>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="msg-input" placeholder="Написать сообщение..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    <button class="send-btn" onclick="sendMsg()" title="Отправить">➤</button>
  </div>
</div>

<script>
const receiverId = {{ partner_id | tojson }};
const myId = {{ my_id }};
let lastMsgId = 0;
const initialMsgs = {{ messages | tojson }};

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function addMessage(username, content, senderId, ts, animate = true) {
  const box = document.getElementById('messages');
  const isMine = senderId === myId;
  const div = document.createElement('div');
  div.className = 'msg-group ' + (isMine ? 'mine' : 'other');
  if (!animate) div.style.animation = 'none';
  div.innerHTML = `
    ${!isMine ? `<div class="sender-name">${escapeHtml(username)}</div>` : ''}
    <div class="bubble">${escapeHtml(content)}</div>
    <div class="time">${ts ? formatTime(ts) : formatTime(new Date())}</div>
  `;
  box.appendChild(div);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    .replace(/\n/g,'<br>');
}

function scrollBottom(smooth = true) {
  const box = document.getElementById('messages');
  box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
}

// Load initial messages without animation
initialMsgs.forEach(m => {
  addMessage(m[0], m[1], m[3], m[2], false);
  if (m[4] && m[4] > lastMsgId) lastMsgId = m[4];
});
scrollBottom(false);

function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  fetch('/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: text, receiver_id: receiverId })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'ok') {
      addMessage(data.username, text, myId, null, true);
      scrollBottom();
    }
  });
}

function pollMessages() {
  fetch(`/poll?receiver_id=${receiverId ?? ''}&last_id=${lastMsgId}`)
  .then(r => r.json())
  .then(data => {
    if (data.messages && data.messages.length > 0) {
      const box = document.getElementById('messages');
      const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;
      data.messages.forEach(m => {
        if (m.sender_id !== myId) {
          addMessage(m.username, m.content, m.sender_id, m.created_at, true);
        }
        if (m.id > lastMsgId) lastMsgId = m.id;
      });
      if (wasAtBottom) scrollBottom();
    }
  })
  .catch(() => {});
}
setInterval(pollMessages, 1000);

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
