<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
    --border: #1e1e2e; --accent: #4f6ef7; --accent2: #7c3aed;
    --green: #10b981; --text: #f0f0f8; --muted: #6b6b80; --sub: #3a3a50;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 320px; background: var(--surface);
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border); flex-shrink: 0;
    position: relative;
  }
  .sidebar-header {
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    position: relative; z-index: 2;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 24px; }
  .sidebar-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 800; color: var(--text);
    letter-spacing: -0.5px;
  }
  .logout {
    color: var(--muted); font-size: 13px; text-decoration: none;
    padding: 6px 12px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .logout:hover { background: #2a2a3a; color: var(--text); }

  .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-box input {
    width: 100%; padding: 10px 14px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; outline: none; font-family: 'DM Sans', sans-serif;
    transition: 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--sub); }

  .chat-list { flex: 1; overflow-y: auto; }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chat-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; cursor: pointer;
    text-decoration: none; color: inherit;
    border-bottom: 1px solid rgba(30,30,46,0.5);
    transition: background 0.15s, transform 0.15s;
    animation: itemIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  .chat-item:nth-child(1) { animation-delay: 0.05s; }
  .chat-item:nth-child(2) { animation-delay: 0.1s; }
  .chat-item:nth-child(3) { animation-delay: 0.15s; }
  .chat-item:nth-child(4) { animation-delay: 0.2s; }
  .chat-item:nth-child(5) { animation-delay: 0.25s; }
  .chat-item:nth-child(6) { animation-delay: 0.3s; }
  .chat-item:nth-child(n+7) { animation-delay: 0.35s; }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .chat-item:hover { background: var(--surface2); }
  .chat-item:active { transform: scale(0.98); }

  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 3px 10px rgba(79,110,247,0.25);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .chat-item:hover .avatar { transform: scale(1.06); box-shadow: 0 5px 16px rgba(79,110,247,0.35); }
  .avatar.global {
    background: linear-gradient(135deg, var(--green), #059669);
    box-shadow: 0 3px 10px rgba(16,185,129,0.25);
  }
  .chat-item:hover .avatar.global { box-shadow: 0 5px 16px rgba(16,185,129,0.35); }

  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .chat-preview { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-arrow { color: var(--sub); font-size: 16px; opacity: 0; transition: opacity 0.2s, transform 0.2s; }
  .chat-item:hover .chat-arrow { opacity: 1; transform: translateX(3px); }

  /* MAIN AREA */
  .main-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--bg); flex-direction: column; gap: 16px;
  }
  .main-icon {
    font-size: 72px; opacity: 0.25;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .main-area p { font-size: 16px; font-weight: 500; color: var(--muted); }
  .main-area small { font-size: 13px; color: var(--sub); }

  @media (max-width: 768px) {
    .sidebar { width: 100%; border-right: none; }
    .main-area { display: none; }
  }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="header-left">
      <span class="header-logo">💬</span>
      <h2>Чаты</h2>
    </div>
    <a href="/logout" class="logout">Выйти</a>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍  Поиск..." id="search" oninput="filterChats()">
  </div>
  <div class="chat-list" id="chatList">
    <a href="/global" class="chat-item">
      <div class="avatar global">🌍</div>
      <div class="chat-info">
        <div class="chat-name">Общий чат</div>
        <div class="chat-preview">Доступен всем</div>
      </div>
      <span class="chat-arrow">›</span>
    </a>
    {% for user in users %}
    <a href="/chat/{{ user[0] }}" class="chat-item" data-name="{{ user[1]|lower }}">
      <div class="avatar">{{ user[1][0]|upper }}</div>
      <div class="chat-info">
        <div class="chat-name">{{ user[1] }}</div>
        <div class="chat-preview">Личный чат</div>
      </div>
      <span class="chat-arrow">›</span>
    </a>
    {% endfor %}
  </div>
</div>
<div class="main-area">
  <div class="main-icon">💬</div>
  <p>Выберите чат</p>
  <small>Привет, {{ username }}! 👋</small>
</div>
<script>
function filterChats() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.chat-item[data-name]').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? 'flex' : 'none';
  });
}
</script>
</body>
</html>
